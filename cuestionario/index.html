<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: one question block per screen, like turning pages of a materials book; fixed bottom bar for navigation */
:root{
  --bg:#EDEFEA; --surface:#F8F9F6; --ink:#1E2421; --muted:#5E6862; --line:#D3D8D1;
  --accent:#2F4A3E; --accent-ink:#F4F6F2; --accent-soft:#DCE5DE; --warn:#9A3B2A;
  --display:"Marcellus","Didot","Times New Roman",serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151A17; --surface:#1D2420; --ink:#E6EAE5; --muted:#9BA69F; --line:#2E3832;
  --accent:#9FC2AE; --accent-ink:#122019; --accent-soft:#25352C; --warn:#E08A74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151A17; --surface:#1D2420; --ink:#E6EAE5; --muted:#9BA69F; --line:#2E3832;
  --accent:#9FC2AE; --accent-ink:#122019; --accent-soft:#25352C; --warn:#E08A74; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 140px}
header.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:28px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.32em}
.step-count{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:2px;background:var(--line);margin-bottom:32px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:clamp(32px,8vw,46px);line-height:1.08}
h2{font-size:clamp(26px,6vw,34px);line-height:1.15}
.lead{color:var(--muted);max-width:60ch;margin:12px 0 0}
.q{margin-top:30px}
.q-label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.q-label em{font-style:normal;text-transform:none;letter-spacing:0}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fields{display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.style{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;overflow:hidden;position:relative}
.style[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.style[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.scene{display:block;object-fit:cover;width:100%;height:auto;aspect-ratio:240/150;max-width:100%}
.opt.multi::before{border-radius:4px}
.opt.multi[aria-pressed="true"]::before{border:0;background:var(--accent);content:"✓";color:var(--accent-ink);font-size:12px;display:grid;place-items:center}
.style-txt{padding:12px 14px 14px}
.style-txt b{display:block;font-family:var(--display);font-weight:400;font-size:19px}
.style-txt small{color:var(--muted);font-size:13px;line-height:1.4;display:block;margin-top:2px}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px}
.color{font:inherit;font-size:13px;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:grid;justify-items:center;gap:8px}
.dot{width:58px;height:58px;border-radius:50%;border:1px solid rgba(0,0,0,.08);display:grid;place-items:center;transition:transform .15s}
.color[aria-pressed="true"] .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent);transform:scale(1.04)}
.color[aria-pressed="true"] .dot::after{content:"✓";color:#fff;text-shadow:0 0 3px rgba(0,0,0,.5);font-size:18px}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px}
.mat{font:inherit;font-size:13px;line-height:1.3;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:grid;gap:8px;text-align:left;position:relative}
.mat .swatch{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.mat[aria-pressed="true"] .swatch{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.mat[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.options{display:grid;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{border:5px solid var(--accent)}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pack{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;cursor:pointer;display:grid;gap:8px;align-content:start;position:relative}
.pack[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pack[aria-pressed="true"]::after{content:"✓";position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:14px}
.pack-name{font-family:var(--display);font-size:24px;line-height:1.15;padding-right:30px}
.pack-desc{color:var(--muted);font-size:15px}
.pack-pre{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:6px}
.pack ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:6px;font-size:15px}
.pack li{display:flex;gap:10px}
.pack li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:9px}
.yn{display:grid;gap:8px}
.yn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 10px 10px 16px}
.yn-row span{min-width:0}
.alc{border:1px solid var(--line,#d8d4cb);border-radius:12px;padding:14px 16px;margin:4px 0 14px;background:rgba(255,255,255,.5);font-size:14px;line-height:1.45}
.alc b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:4px}
.alc ul{margin:0 0 10px;padding:0;list-style:none}.alc li{padding:1px 0}.alc li:before{content:"✓ ";color:#2f4a3c}
.alc .no li:before{content:"✕ ";color:#9a6b5c}.alc .no{margin-bottom:0}
.yn-hint{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:14px;color:var(--ink);background:none;border:0;padding:7px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.summary{margin-top:24px;display:grid;gap:0;border-top:1px solid var(--line)}
.summary div{display:grid;grid-template-columns:minmax(110px,30%) 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.summary dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.summary dd{margin:0;min-width:0}
.err{color:var(--warn);font-size:14px;margin-top:14px}
.intro-list{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:10px;color:var(--muted)}
.intro-list li{display:flex;gap:12px}
.intro-list b{color:var(--ink);font-weight:500;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:10px;justify-content:space-between}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:999px;padding:13px 24px;cursor:pointer;border:1px solid var(--accent)}
.btn-primary{background:var(--accent);color:var(--accent-ink);flex:1;max-width:320px;margin-left:auto}
.btn-ghost{background:none;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.owner-link{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0}
.resp{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-top:12px}
.resp h3{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.resp small{color:var(--muted)}
.note{background:var(--accent-soft);border-radius:6px;padding:14px 16px;font-size:14px;margin-top:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.yn-item{background:var(--surface);border:1px solid var(--line);border-radius:6px}.yn-item.on{border-color:var(--accent)}.yn-item .yn-row{background:none;border:0}.follow{border-top:1px dashed var(--line);margin:0 16px;padding:12px 0 14px}.follow-q{font-size:14px;font-weight:500;margin-bottom:8px}.follow-q small{font-weight:400;color:var(--muted)}.follow .chip{font-size:14px;padding:7px 14px;background:var(--bg)}.follow .chip[aria-pressed="true"]{background:var(--accent)}.follow input[type=text]{margin-top:10px;font-size:15px;padding:10px 12px;background:var(--bg)}.sub-q{margin:12px 0 4px}.q-sub{display:block;font-size:14px;opacity:.7;margin-bottom:6px}</style>
</head>

function render(){
  const k=ST()[step];
  $("#screen").innerHTML=view();
  const total=ST().length-2;
  $("#count").textContent=ownerView?"Panel interno":(step>0&&step<=total?`Paso ${step} de ${total}`:"");
  $("#prog").style.width=ownerView?"100%":`${Math.min(step,total)/total*100}%`;
  $("#back").hidden=(step===0&&!ownerView)||k==="listo";
  $("#next").hidden=ownerView||k==="listo";
  $("#next").textContent=k==="intro"?"Empezar":k==="resumen"?(saving?"Enviando…":"Enviar respuestas"):"Siguiente";
  $("#next").disabled=saving;
  $("#bar").hidden=k==="listo";
  const ob=$("#ownerBtn"); if(ob) ob.onclick=openOwner;
  ["nombre","contacto","ubicacion","notas","m2","tubicacion","tm2","cm2","obratxt"].forEach(f=>{const el=$("#f-"+f);if(el)el.oninput=e=>S[f]=e.target.value});document.querySelectorAll("[data-itxt]").forEach(el=>el.oninput=e=>S.itxt[el.dataset.itxt]=e.target.value);
  window.scrollTo(0,0);
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.multi){
    const key=b.dataset.multi, max=+b.dataset.max||0;
    if(key.startsWith("term:")){const g=key.slice(5);S.term[g]=S.term[g]||[];toggle(S.term[g],b.dataset.v)}
    else if(key.startsWith("mat:")){const g=key.slice(4);S.mat[g]=S.mat[g]||[];toggle(S.mat[g],b.dataset.v)}
    else if(key==="espacios"&&b.dataset.v===TODOS) S.espacios=S.espacios.includes(TODOS)?[]:[TODOS];
    else toggle(S[key],b.dataset.v,max);
    refresh(); return;
  }
  if(b.dataset.cama){S.camas=S.camas||{};S.camas[b.dataset.cama]=b.dataset.v;refresh();return}
  if(b.dataset.one){S[b.dataset.one]=S[b.dataset.one]===b.dataset.v?"":b.dataset.v;refresh();return}
  if(b.dataset.yn){S.interv[b.dataset.yn]=b.dataset.v;refresh();return}
  if(b.dataset.idet){const k=b.dataset.idet,v=b.dataset.v,a=S.idet[k]||[];if(TODO_DET.includes(v))S.idet[k]=a.includes(v)?[]:[v];else{S.idet[k]=a.filter(x=>!TODO_DET.includes(x));toggle(S.idet[k],v)}refresh();return}
});
function refresh(){ // update pressed states without losing scroll
  const y=window.scrollY; const k=ST()[step]; $("#screen").innerHTML=view();
  ["nombre","contacto","ubicacion","notas","m2","tubicacion","tm2","cm2","obratxt"].forEach(f=>{const el=$("#f-"+f);if(el)el.oninput=e=>S[f]=e.target.value});document.querySelectorAll("[data-itxt]").forEach(el=>el.oninput=e=>S.itxt[el.dataset.itxt]=e.target.value);
  window.scrollTo(0,y);
}

$("#back").onclick=()=>{if(ownerView){ownerView=false;render();return}err="";step=Math.max(0,step-1);render()};

function faltante(k){

    if(!PRE.id){if(!v(S.nombre))return "Escribe tu nombre para continuar.";if(!v(S.contacto))return "Escribe tu WhatsApp o email.";if(!v(S.ubicacion))return "Escribe la ubicación del proyecto.";if(!S.tipo)return "Elige el tipo de propiedad.";}
    if(!S.uso)return "Elige para qué la vas a usar.";
    if(!ARQ&&!esLM()&&!S.espacios.length)return OBRA?"Elige los espacios a intervenir.":"Elige los espacios a diseñar.";
    if(!ARQ&&!OBRA&&PRE.sp){if(!S.pbanos)return "Elige cuántos baños tiene.";if(!S.pext)return "Elige si tiene exterior.";}
    if(!ARQ&&!OBRA){if(!recLabels().length)return "Elige cuántas recámaras tiene.";const r=recLabels().find(r=>!(S.camas||{})[r]);if(r)return "Elige la cama de "+r+".";}}
  if(k==="paquete"&&!S.paquete)return "Elige un paquete para continuar.";
  if(k==="estilo"&&!S.estilos.length)return "Elige al menos un estilo.";
  if(k==="colores"){if(!S.colores.length)return "Elige al menos un color.";if(!ARQ&&!S.donde.length)return "Elige dónde quieres esos colores.";}
  if(k==="terminaciones"){const g=Object.keys(TERM).find(g=>!(S.term[g]||[]).length);if(g)return "Elige al menos una opción en "+g+".";}
  if(k==="intervenciones"){if(!S.muros)return "Elige qué hacemos con los muros.";const i=intervVisibles().find(i=>S.interv[i]==="Sí"&&INTERV_DET[i]&&!(S.idet[i]||[]).length);if(i)return "En «"+i+"» elige al menos una opción ("+INTERV_DET[i].q.toLowerCase()+").";}
  const lmErr=()=>esLM()?(!S.piso?"Elige en qué piso está la unidad.":(!esST()&&!S.tvrec?"Responde si quieres TV en las recámaras.":"")):""; if(k==="proyecto"&&lmErr())return lmErr(); if(k==="presupuesto"){if(!S.presupuesto)return "Elige un rango de presupuesto.";if(!ARQ&&!OBRA&&S.obraq==="Sí"&&!S.obrasel.length)return "Elige qué te gustaría cambiar de obra.";if(pideVent()&&!S.ventpref)return "Elige si prefieres persianas o cortinas.";if(!S.plazo)return "Elige para cuándo lo necesitas.";}
  if(k==="materiales"){const g=Object.keys(MAT_ARQ).find(g=>!(S.mat[g]||[]).length);if(g)return "Elige al menos una opción en "+g+".";if(!S.sensacion)return "Elige cómo quieres que se sienta la casa.";}
  if(k==="obra"&&!S.obra.length)return "Marca al menos una cosa que quieras cambiar.";
  if(k==="inmueble"){if(!v(S.m2))return "Escribe los metros cuadrados aproximados.";if(!S.planos)return "Responde si tienes planos.";if(!S.vive)return "Responde si vas a vivir ahí durante la obra.";if(!S.permisos)return "Responde lo de los permisos (si no sabes, elige «No sé»).";}
  if(k==="terreno"){if(!S.terreno)return "Responde si ya tienes terreno.";if(!v(S.tubicacion))return S.terreno==="Sí"?"Escribe la ubicación del terreno.":"Escribe la zona donde lo buscas.";if(S.terreno==="Sí"&&!v(S.tm2))return "Escribe la medida del terreno.";}
  if(k==="programa"){if(!S.construir)return "Elige el tipo de construcción.";if(!v(S.cm2))return "Escribe los m² a construir aproximados.";if(!S.recs)return "Elige cuántas recámaras.";if(!S.banos)return "Elige cuántos baños.";}
  if(k==="amueblar"&&!S.paquete)return "Elige una opción para continuar.";
  return "";
}
function alertInline(msg){
  let p=$("#screen .err"); if(!p){p=document.createElement("p");p.className="err";$("#screen").appendChild(p)}
  p.textContent=msg; p.scrollIntoView({behavior:"smooth",block:"center"});
}

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbyPxz7iZikEmNlYQPzhr8ySz61Gay_cBFzjcXxhsDrdRfCl_8NN-Y5iY6d0kzbBJET88A/exec";
function volcarExtras(){if(ARQ||OBRA)return;Object.keys(S.interv).forEach(k=>S.interv[k]="No");S.idet={};S.itxt={};if(S.obraq==="Sí")S.obrasel.forEach(x=>{S.interv[x]="Sí"});if(S.paquete==="Muebles y deco"&&S.cortmd==="Sí")S.interv["Cortinas y persianas"]="Sí";if(!S.muros)S.muros="No tocarlos";}
async function submit(){volcarExtras();
  err="";saving=true;render();
  const j=a=>[].concat(a||[]).join(", ");
  const fila={
    "ID cliente":PRE.id,"Nombre":S.nombre,"Contacto":S.contacto,"Paquete":S.paquete,"Ubicación":S.ubicacion,"Tipo de propiedad":S.tipo,"Uso":S.uso,
    "Espacios":(esLM()&&!S.espacios.length)?"Todos los espacios":j(S.espacios),"Estilos":j(S.estilos),"Colores":j(S.colores),"Dónde van los colores":j(S.donde),
    "Fachada":j(S.mat["Fachada"]),"Pisos":j(S.mat["Pisos"]),"Cancelería":j(S.mat["Ventanas y cancelería"]),"Carácter":S.sensacion,"Madera":j(S.term["Madera"]),"Piedra":j(S.term["Piedra"]),"Metales":j(S.term["Metales"]),"Textiles":j(S.term["Textiles"]),
    "Muros":S.muros,"Intervenir además":intervTxt(S),
    "Presupuesto":S.presupuesto,"Plazo":S.plazo,"Baños":PRE.sp?(S.pbanos||""):"","Exterior":PRE.sp?(S.pext||""):"","Metros cuadrados":PRE.sp?"":S.m2,"Recámaras":(!ARQ&&!OBRA&&!esST())?(S.recs_i||""):"","Camas":(!ARQ&&!OBRA)?recLabels().map(r=>r+": "+((S.camas||{})[r]||"")).join(" · "):"","Notas":[S.notas,(S.obraq==="Sí"&&S.obratxt)?"Obra: "+S.obratxt:""].filter(Boolean).join(" · "),"Piso":esLM()?S.piso:"","TV en recámaras":(esLM()&&!esST())?S.tvrec:"","Cortinas o persianas":pideVent()?S.ventpref:"",
    "Tipo de proyecto":ARQ?"Arquitectura (desde cero)":OBRA?"Remodelación":"Interiores","Terreno":[S.terreno,S.tubicacion,S.tm2].filter(Boolean).join(" · "),"Construir":[S.construir,S.cm2,S.recs&&(S.recs+" rec."),S.banos&&(S.banos+" baños"),j(S.extras)].filter(Boolean).join(" · "),"Obra":j(S.obra),"Planos":S.planos,"Vive durante la obra":S.vive,"Permisos":S.permisos
  };
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(fila)});
    saving=false;step++;render();
  }catch(x){
    saving=false;err="No se pudo enviar. Revisa tu conexión y toca Enviar otra vez.";render();
  }
}
render();
</script>
